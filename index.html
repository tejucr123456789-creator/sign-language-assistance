<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Finger Counter & Sign App</title>
  <!-- MediaPipe Hands & Camera Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #00f2fe;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-top: 10px; color: #ffffff; font-size: 1.8rem; }
    #status { font-size: 1rem; color: #ff007f; margin-bottom: 15px; }
    
    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .video-container {
      position: relative;
      border: 4px solid #1c2541;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2);
    }
    video, canvas {
      transform: scaleX(-1); /* Mirror view */
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .output-box {
      background-color: #1c2541;
      border: 2px solid #00f2fe;
      border-radius: 10px;
      padding: 15px 25px;
      width: 80%;
      max-width: 600px;
    }

    #number-output {
      font-size: 3rem;
      font-weight: bold;
      color: #7ee787;
      margin: 5px 0;
    }

    .btn {
      background-color: #00f2fe;
      color: #0b132b;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background-color: #48cae4; }
  </style>
</head>
<body>

  <h1>Interactive Finger Counting & Sign Aid</h1>
  <div id="status">Loading AI Hand-Tracking Model...</div>

  <div class="main-container">
    <div class="video-container">
      <video id="webcam" width="480" height="360" autoplay playsinline></video>
      <canvas id="output_canvas" width="480" height="360"></canvas>
    </div>

    <div class="output-box">
      <p style="margin:0; font-size: 0.9rem; color:#a5c4d4;">ACTIVE NUMBER / GESTURE:</p>
      <div id="number-output">WAITING FOR HAND...</div>
      <button class="btn" onclick="speakNumber()">🔊 Speak Aloud</button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const numberOutput = document.getElementById('number-output');
    const statusText = document.getElementById('status');

    function countFingers(landmarks) {
      // Landmark indices for finger tips and lower joints (PIP)
      // Thumb: tip 4, ip 3, mcp 2
      // Index: tip 8, pip 6
      // Middle: tip 12, pip 10
      // Ring: tip 16, pip 14
      // Pinky: tip 20, pip 18

      let fingersUp = 0;

      // 1. Thumb Check (Comparing x-coordinate based on hand orientation assumption or tip vs joint distance)
      // For a mirrored webcam view facing you:
      // Right hand thumb tip (4) is to the left of IP joint (3)
      if (landmarks[4].x < landmarks[3].x) {
        fingersUp++;
      }

      // 2. Index Finger
      if (landmarks[8].y < landmarks[6].y) {
        fingersUp++;
      }

      // 3. Middle Finger
      if (landmarks[12].y < landmarks[10].y) {
        fingersUp++;
      }

      // 4. Ring Finger
      if (landmarks[16].y < landmarks[14].y) {
        fingersUp++;
      }

      // 5. Pinky Finger
      if (landmarks[20].y < landmarks[18].y) {
        fingersUp++;
      }

      return fingersUp;
    }

    function onResults(results) {
      statusText.innerText = "System Active — Raise your fingers!";
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Draw hand landmarks on canvas
        for (const point of landmarks) {
          const x = point.x * canvasElement.width;
          const y = point.y * canvasElement.height;
          canvasCtx.beginPath();
          canvasCtx.arc(x, y, 4, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#00f2fe';
          canvasCtx.fill();
        }

        // Count active raised fingers
        const count = countFingers(landmarks);
        
        // Display numbers with custom phrases
        const labels = [
          "0 (ZERO / FIST)",
          "1 (ONE FINGER)",
          "2 (TWO FINGERS - PEACE)",
          "3 (THREE FINGERS)",
          "4 (FOUR FINGERS)",
          "5 (FIVE FINGERS - OPEN PALM)"
        ];

        numberOutput.innerText = labels[count] || `${count} FINGERS`;
      } else {
        numberOutput.innerText = "NO HAND DETECTED";
      }
      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 480,
      height: 360
    });

    camera.start();

    function speakNumber() {
      const textToSpeak = numberOutput.innerText;
      if ('speechSynthesis' in window && !textToSpeak.includes("WAITING") && !textToSpeak.includes("NO HAND")) {
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
